<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center><h1>scholar form</h1></center>
    <hr>
    <center>
       <form>
        <table>
            <tr>
                <td>Name:</td><td><input type="text" placeholder="enter your name"></td>
            </tr>

            <tr>
                <td>Age:</td><td><input type="text" placeholder="enter your age"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td><input type="radio" name="gender">male</td>
                <td><input type="radio" name="gender">female</td>
            </tr>

            <tr>
                <td>Email:</td><td><input type="email" placeholder="enter your email"></td>
            </tr>

           <tr>
            <td>Location</td>
            <td>
                <select>
                    <option>Chennai</option>
                    <option>Delhi</option>
                    <option>Pondicherry</option>
                </select>
            </td>
           </tr>
           
           <tr>
              <td>upload your resume</td>
              <td>
                <input type="file">
              </td>
           </tr>

           <tr>
            <td><input type="reset"></td>
            <td><input type="submit"></td>
           </tr>
        </table>
       </form> 
    </center>
</body>
</html>
